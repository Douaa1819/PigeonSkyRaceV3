version: '3.8'

services:
  springboot-app:
    container_name: pigeon-SkyRaceV3
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/pigeonskyv3
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SERVER_PORT=8443
    networks:
      - spring-postgres-network
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: always

  db:
    container_name: postgres
    image: postgres:latest
    ports:
      - "5433:5432"
    networks:
      - spring-postgres-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pigeonskyv3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    restart: unless-stopped

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
    ports:
      - "8444:8443"
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/pigeonskyv3
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=password
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTPS_KEY_STORE_FILE=/opt/keycloak/conf/keycloak.p12
      - KC_HTTPS_KEY_STORE_PASSWORD=codedouaa
      - KC_HTTPS_KEY_STORE_TYPE=PKCS12
      - KC_HTTPS_KEY_ALIAS=keycloak-new
    volumes:
      - ./keycloak.p12:/opt/keycloak/conf/keycloak.p12
    networks:
      - spring-postgres-network
    restart: always

networks:
  spring-postgres-network:
    driver: bridge

volumes:
  postgres-data:
  jenkins_home:
